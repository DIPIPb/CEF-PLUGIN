<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--tx:#fff;--dim:rgba(255,255,255,.5);--bg:#1c1c1c;--pane:rgba(255,255,255,.07);--pane2:rgba(255,255,255,.15);--in:rgba(0,0,0,.28);--bl:#0000ff;--ok:#5fd13a;--bad:#ff4a3a;--gold:#e8b923;--ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:transparent;font:15px/1.3 "Roboto Condensed","Arial Narrow",Arial,sans-serif;color:var(--tx);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:var(--in);cursor:pointer;transition:background-color .22s var(--ease),color .22s var(--ease),transform .16s var(--ease),opacity .2s}
button:hover{background:var(--pane2)}
button:active:not(:disabled){transform:scale(.97)}
button.on,button.on:hover{background:var(--bl);color:#fff;font-weight:700}
button:disabled{opacity:.4;cursor:default}
img{display:block}
b{font-weight:700}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:none}
body.demo #app{background:#1c1c1c}
#app.on{display:flex;animation:fadein .26s var(--ease)}
#app.on #shell{animation:shellin .4s var(--ease)}
#app.out{animation:fadeout .2s var(--ease) forwards}
#app.out #shell{animation:shellout .2s var(--ease) forwards}
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes shellin{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes shellout{to{opacity:0;transform:translateY(8px) scale(.985)}}

/* ===== каркас как на макете ===== */
#shell{width:min(1025px,96vw);height:min(470px,92vh);display:flex;gap:9px}
#side{width:21%;min-width:190px;flex:none;display:flex;flex-direction:column;gap:6px;min-height:0}
#me{display:flex;align-items:center;gap:11px;padding:0 10px;background:var(--pane);height:66px;flex:none}
#ava{width:52px;height:52px;flex:none;background:var(--in);display:grid;place-items:center;font-size:22px;font-weight:700;overflow:hidden}
#ava img{width:100%;height:100%;object-fit:cover}
#me div{min-width:0}
#nm{display:block;font-size:19px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#exp{display:block;font-size:11px;margin-top:3px;color:rgba(255,255,255,.75);letter-spacing:.03em}
#nav{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.nb{display:flex;gap:6px;flex:none;height:var(--rh,60px);padding:0;background:none!important;text-align:center}
.nb .ic,.nb .lb{background:var(--pane);transition:background-color .22s var(--ease),color .22s var(--ease)}
.nb .ic{width:var(--rh,60px);height:100%;display:grid;place-items:center;flex:none;padding:calc(var(--rh,60px)*.14)}
.nb .lb{flex:1;min-width:0;display:grid;place-items:center;font-size:16px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.nb .ic svg,.nb .ic img{width:100%;height:100%;display:block;object-fit:contain}
.nb .ic svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nb:hover .ic,.nb:hover .lb{background:var(--pane2)}
.nb.on .ic,.nb.on .lb{background:var(--bl);color:#fff}
#main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:9px}
#head{height:66px;flex:none;background:var(--pane);display:flex;align-items:center;padding:0 24px;font-size:25px;font-weight:700}
#body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;background:var(--pane);padding:14px 16px}
.msg{margin:auto;color:var(--dim);font-size:16px;text-align:center;line-height:1.5}
.msg small{display:block;font-size:13px;margin-top:4px}
.row{display:flex;gap:8px;flex:none}
.row>button{height:38px;padding:0 20px;font-size:16px}
.row.seg>button{flex:1}

/* ===== общие компоненты ===== */
.grid{display:grid;gap:8px;flex:1;min-height:0;align-content:start}
.card{transition:background-color .2s var(--ease),transform .2s var(--ease);background:var(--in);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 4px 6px;min-height:0;overflow:hidden}
.card img{width:56px;height:56px;object-fit:contain;flex:none}
.card span{font-size:12px;text-align:center;line-height:1.1;max-width:100%;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.card em{font-style:normal;font-weight:700;font-size:14px}
.card:hover{transform:translateY(-2px);background:var(--pane2)}
.card .pr{font-weight:700;font-size:13px}
.card img,.it img,.rw img{opacity:0;transition:opacity .3s var(--ease)}
.card img.ok,.it img.ok,.rw img.ok{opacity:1}
.pg{display:flex;gap:6px;flex:none;justify-content:center;align-items:center}
.pg button{min-width:40px;height:34px;padding:0 10px;font-size:15px}
.pg i{width:26px;text-align:center;color:var(--dim);font-style:normal}
.foot{display:flex;gap:10px;flex:none;align-items:center;justify-content:space-between}
.foot>button{height:34px;padding:0 20px;flex:none;font-size:15px}
.foot.r{justify-content:flex-end}
.warn{flex:none;background:rgba(209,178,131,.22);color:#d1b283;padding:10px;text-align:center}
.set{display:flex;gap:8px;flex:1;min-height:0}
.cats{width:34%;flex:none;display:flex;flex-direction:column;gap:6px}
.cats button{height:48px;text-align:left;padding:0 14px;color:rgba(255,255,255,.7);font-size:16px}
.tg{flex:1;display:flex;flex-direction:column;gap:6px;overflow:hidden;min-height:0}
.sw{display:flex;justify-content:space-between;align-items:center;padding:0 14px;height:44px;background:var(--in);cursor:pointer;flex:none;transition:background-color .2s var(--ease)}
.sw:hover{background:var(--pane2)}
.sw i{width:38px;height:20px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background-color .25s var(--ease)}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--dim);transition:left .26s var(--spring),background-color .25s var(--ease)}
.sw.on i{background:rgba(95,209,58,.3)}
.sw.on i:after{left:21px;background:var(--ok)}
.kb{min-width:74px;text-align:center;padding:4px 12px;background:var(--pane);color:var(--ok);font-weight:700;font-size:14px;flex:none}
.kb.empty{color:var(--dim);font-weight:400}.kb.wait{color:#fff;background:var(--bl)}
.info{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.info p{background:var(--in);padding:10px 14px;line-height:1.45;font-size:15px}
#demo{position:fixed;right:14px;bottom:14px;padding:10px 16px;display:none;background:var(--bl);color:#fff;font-weight:700}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.vin{animation:vin .34s var(--ease) backwards;animation-delay:calc(var(--i,0)*24ms)}

/* ===== ГЛАВНАЯ ===== */
.hn{flex:none;text-align:center;font-size:24px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0 8px;
 background:linear-gradient(90deg,#fff 0%,#0000ff 25%,#fff 50%,#0000ff 75%,#fff 100%);background-size:200% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 9s linear infinite}
@keyframes shine{from{background-position:0% 0}to{background-position:200% 0}}
.hb{flex:none;height:10px;display:flex;gap:0;background:var(--in);border-radius:999px;overflow:hidden}
.hb i{display:block;height:100%;width:0;transition:width .9s var(--ease)}
.hb .a{background:#2bff0f}
.hb .b{background:#ff1c0a}
.hb .c{background:#fff}
.hl{display:flex;gap:18px;flex:none;font-size:12px;font-weight:700;padding-bottom:4px}
.hl span{display:flex;align-items:center;gap:6px}
.hl span:before{content:"";width:14px;height:14px;border-radius:50%;background:var(--c)}
.ban{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--in)}
.ban img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ban .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;letter-spacing:.06em;font-weight:700;text-transform:uppercase;text-align:center;padding:20px;background:linear-gradient(135deg,#262626,#444)}

/* ===== СТАТИСТИКА ===== */
.sv{display:flex;gap:9px;flex:1;min-height:0}
.sl{width:200px;flex:none;display:flex;flex-direction:column;gap:6px;min-height:0}
.sr{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.sb{display:flex;gap:6px;height:54px;flex:none;padding:0;background:none!important;text-align:center}
.sb .ic,.sb .lb{background:var(--in);transition:background-color .22s var(--ease),color .22s var(--ease)}
.sb .ic{width:54px;flex:none;display:grid;place-items:center;padding:8px}
.sb .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sb .lb{flex:1;min-width:0;display:grid;place-items:center;font-size:15px;line-height:1.1;font-weight:700;padding:0 6px}
.sb:hover .ic,.sb:hover .lb{background:var(--pane2)}
.sb.on .ic,.sb.on .lb{background:var(--bl);color:#fff}
.kc{flex:1;min-height:0;background:var(--in);display:flex;align-items:center;gap:10px;padding:0 12px}
.kc svg{width:84px;height:84px;flex:none}
.kc small{display:block;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.kc b{display:block;font-size:28px;line-height:1.1}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:none}
.tile{background:var(--in);padding:8px 12px 9px;position:relative;overflow:hidden;min-width:0}
.tile small{display:block;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tile b{display:block;font-size:24px;margin-top:1px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:58px;align-content:start;gap:4px 8px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;}
.hs{display:grid;grid-auto-rows:42px;align-content:start;gap:4px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;}
.rw{position:relative;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--in);overflow:hidden;min-height:0;min-width:0}
.rw>*{position:relative;flex:none}
.rw>.f{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.1);transition:width .8s var(--ease)}
.rw .w{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw img{width:26px;height:26px;object-fit:contain}
.rg .rw img{width:40px;height:40px}
.hs .rw img{width:30px;height:30px}
.rg .rw{font-size:16px}
.rw em{font-style:normal;font-weight:700}
.bd{width:24px;height:24px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--pane)}
.bd.k{background:var(--ok);color:#1c1c1c}.bd.d{background:var(--bad);color:#1c1c1c}.bd.s{color:var(--dim)}
.dist{color:var(--dim);margin-left:6px}
.tb{display:flex;flex-direction:column;gap:4px;flex:1;min-height:0}
.tbr{display:grid;grid-auto-rows:36px;align-content:start;gap:4px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;}
.tr{display:grid;grid-template-columns:40px 1fr 74px 74px 84px 62px;align-items:center;gap:8px;padding:0 12px 0 8px;background:var(--in);min-height:0}
.tr.h{height:26px;flex:none;background:none;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tr .c{text-align:right}
.tr .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps{width:30px;height:22px;display:grid;place-items:center;background:var(--pane);font-weight:700;font-size:13px}
.ps.p1{background:var(--gold);color:#1c1c1c}.ps.p2{background:#c9c9c9;color:#1c1c1c}.ps.p3{background:#c27a3e;color:#1c1c1c}
.rg::-webkit-scrollbar,.hs::-webkit-scrollbar,.tbr::-webkit-scrollbar{width:6px}
.rg::-webkit-scrollbar-thumb,.hs::-webkit-scrollbar-thumb,.tbr::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25)}
.rg::-webkit-scrollbar-thumb:hover,.hs::-webkit-scrollbar-thumb:hover,.tbr::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.4)}
.rg::-webkit-scrollbar-track,.hs::-webkit-scrollbar-track,.tbr::-webkit-scrollbar-track{background:transparent}
.tr.me{background:var(--bl);color:#fff;font-weight:700}
.tr.me .ps{background:rgba(255,255,255,.25);color:#fff}

/* ===== вайпблок: одна страница с прокруткой, стиль меню (те же цвета, без скруглений) ===== */
.tlwrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:var(--in);color:var(--tx);padding:20px 12px 26px;animation:vin .34s var(--ease) backwards}
.tlwrap::-webkit-scrollbar{width:6px}
.tlwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}
.tlwrap::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.34)}
.tlwrap::-webkit-scrollbar-track{background:transparent}
.tl{position:relative;min-height:40px}
.tlb,.tlf{position:absolute;left:50%;width:2px;margin-left:-1px}
.tlb{background:rgba(255,255,255,.16)}
.tlf{background:var(--bl);transform-origin:top;transform:scaleY(0);transition:transform 1.1s var(--ease)}
.ts{position:absolute;top:0;width:50%;padding:0 34px;animation:tsin .55s var(--ease) backwards;animation-delay:calc(var(--i)*90ms)}
.ts.rt{left:50%;--dx:22px}
.ts.lf{left:0;text-align:right;--dx:-22px}
@keyframes tsin{from{opacity:0;transform:translateX(var(--dx))}}
.th{display:flex;align-items:baseline;line-height:22px;height:22px;white-space:nowrap}
.ts.lf .th{justify-content:flex-end}
.th b{font-size:17px;color:var(--tx);text-transform:uppercase;transition:color .4s var(--ease)}
.ts:not(.ul) .th b{color:var(--dim)}
.th .mt{font-size:13px;font-weight:700;color:var(--dim);margin-left:10px;padding-left:10px;position:relative}
.th .mt:empty{display:none}
.th .mt:before{content:"";position:absolute;left:0;top:50%;height:11px;margin-top:-5px;width:1px;background:rgba(255,255,255,.22)}
.dot{position:absolute;top:5px;width:12px;height:12px;background:rgba(255,255,255,.28);transition:background-color .5s var(--ease);animation:dotin .45s var(--spring) backwards;animation-delay:calc(var(--i)*90ms + 140ms)}
.ts.rt .dot{left:-6px}
.ts.lf .dot{right:-6px}
.ts.ul .dot{background:var(--bl)}
@keyframes dotin{from{transform:scale(0)}}
.its{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.ts.lf .its{justify-content:flex-end}
.it{position:relative;width:48px;height:48px;background:var(--pane);display:grid;place-items:center;transition:transform .2s var(--ease),background-color .2s var(--ease);animation:itin .4s var(--ease) backwards;animation-delay:calc(var(--i)*90ms + 200ms + var(--j,0)*22ms)}
.ts:not(.ul) .it{background:rgba(255,255,255,.05)}
.ts:not(.ul) .it img.ok{opacity:.55}
@keyframes itin{from{opacity:0;transform:translateY(8px)}}
.it:hover{transform:translateY(-2px);background:var(--pane2);z-index:3}
.it img{width:40px;height:40px;object-fit:contain}
.it:after{content:attr(data-n);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translate(-50%,4px);background:#000;border:1px solid rgba(255,255,255,.16);color:var(--tx);font-size:13px;line-height:1;padding:6px 9px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .16s var(--ease),transform .16s var(--ease)}
.it:hover:after{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"><div id="shell"><div id="side"><div id="me"><div id="ava"></div><div><b id="nm"></b><small id="exp"></small></div></div><div id="nav"></div></div><div id="main"><div id="head"><span id="ttl"></span></div><div id="body"></div></div></div></div>
<button id="demo">Открыть меню (демо)</button>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var el=function(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
var btn=function(x,c,f){var b=el('button',c,x);b.onclick=f;return b};
var S={items:[],active:'',me:{},tab:'me',sub:'res',page:1,d:{},empty:{},cat:0,bf:'all'};
var live=false,demo=false;
var send=function(a,d){if(demo)return mock(a,d);if(window.cef&&cef.send)cef.send(a,d)};

/* ================= ИКОНКИ ================= */
/* Имена файлов rustlabs = shortname предмета (metal.ore.png, fat.animal.png, lowgradefuel.png ...) */
var ALIAS={
 'wood':'wood','дерево':'wood','древесина':'wood',
 'stones':'stones','stone':'stones','камень':'stones','камни':'stones',
 'metal ore':'metal.ore','металлическая руда':'metal.ore','метал руда':'metal.ore','руда':'metal.ore',
 'hq metal ore':'hq.metal.ore','high quality metal ore':'hq.metal.ore','мвк руда':'hq.metal.ore',
 'sulfur ore':'sulfur.ore','серная руда':'sulfur.ore',
 'sulfur':'sulfur','сера':'sulfur',
 'cloth':'cloth','ткань':'cloth',
 'leather':'leather','кожа':'leather',
 'animal fat':'fat.animal','fat animal':'fat.animal','жир':'fat.animal','животный жир':'fat.animal',
 'scrap':'scrap','металлолом':'scrap','скрап':'scrap',
 'metal fragments':'metal.fragments','metal fragment':'metal.fragments','металлические фрагменты':'metal.fragments','металлические обломки':'metal.fragments','фрагменты':'metal.fragments',
 'high quality metal':'metal.refined','metal refined':'metal.refined','hqm':'metal.refined','мвк':'metal.refined','металл высокого качества':'metal.refined',
 'low grade fuel':'lowgradefuel','lowgradefuel':'lowgradefuel','низкосортное топливо':'lowgradefuel','топливо':'lowgradefuel',
 'charcoal':'charcoal','уголь':'charcoal','древесный уголь':'charcoal',
 'gun powder':'gunpowder','gunpowder':'gunpowder','порох':'gunpowder',
 'bone fragments':'bone.fragments','bone fragment':'bone.fragments','кости':'bone.fragments','костные фрагменты':'bone.fragments',
 'plant fiber':'plantfiber','plantfiber':'plantfiber','растительное волокно':'plantfiber',
 'paper':'paper','бумага':'paper','explosives':'explosives','взрывчатка':'explosives','crude oil':'crude.oil','нефть':'crude.oil',
 'raw bear meat':'bearmeat','bear meat':'bearmeat','raw wolf meat':'wolfmeat.raw','raw chicken breast':'chicken.raw','raw deer meat':'deermeat.raw','raw pork':'pork.raw','raw horse meat':'horsemeat.raw','raw human meat':'humanmeat.raw'
};
var RU={'wood':'Дерево','stones':'Камень','metal.ore':'Металл. руда','hq.metal.ore':'МВК руда','sulfur.ore':'Серн. руда','sulfur':'Сера','cloth':'Ткань','leather':'Кожа','fat.animal':'Жир','scrap':'Металлолом','metal.fragments':'Мет. фрагменты','metal.refined':'МВК','lowgradefuel':'Топливо','charcoal':'Уголь','gunpowder':'Порох','bone.fragments':'Кости','plantfiber':'Волокно','paper':'Бумага','explosives':'Взрывчатка','crude.oil':'Нефть','bearmeat':'Мясо медведя','wolfmeat.raw':'Мясо волка','chicken.raw':'Курица','deermeat.raw':'Мясо оленя','pork.raw':'Свинина','horsemeat.raw':'Конина','humanmeat.raw':'Мясо человека'};
var norm=function(s){return String(s==null?'':s).toLowerCase().replace(/[._\-\s]+/g,' ').trim()};
function resolve(raw){
  var k=norm(raw);if(ALIAS[k])return ALIAS[k];
  var s=String(raw==null?'':raw).trim();
  return /^[A-Za-z0-9._ ]+$/.test(s)?s.toLowerCase():k.replace(/ /g,'.');
}
/* Оригинальные иконки предметов Rust. ICON_BASE - ваш сайт на Vercel с папкой /icons (api/icon.js), например
   'https://my-site.vercel.app/icons/'; домен тогда нужно добавить в клиентский Security.ImageHosts. Пусто = берём напрямую с rustlabs. */
var ICON_BASE='';
var ONCEF=location.hostname==='cef.local';
var SRC=function(id){
  var names=[id];
  if(/[ ]/.test(id))names.push(id.replace(/ +/g,'.'));          /* 'military flamethrower' -> 'military.flamethrower' */
  var out=[];
  names.forEach(function(n){var e=encodeURIComponent(n);
    if(ICON_BASE)out.push(ICON_BASE+e+'.png');
    else if(!ONCEF)out.push('icons/'+e+'.png');                 /* свой сайт: иконки через api/icon.js */
    out.push('https://rustlabs.com/img/items180/'+e+'.png',      /* оригинальные иконки предметов Rust */
             'https://www.rustedit.io/images/imagelibrary/'+e+'.png',

var GAME_ICONS=false;   /* true = сначала просить иконки у клиентского мода (local.icons) */
var ICONS={},REQ={},WAIT={},Q=[],qt=0;
function web(i,id,raw){
  var L=SRC(id),k=0,tm=0;
  if(BAD[id]){i.src=fallback(id,raw);return}
  var arm=function(){tm=setTimeout(next,3500)};
  var next=function(){
    clearTimeout(tm);k++;
    if(k<L.length){arm();i.src=L[k]}
    else{i.onerror=i.onload=null;BAD[id]=1;i.src=fallback(id,raw)}
  };
  i.onload=function(){clearTimeout(tm)};
  i.onerror=next;
  arm();i.src=L[0];
}
function flushQ(){
  qt=0;
  if(Q.length)send('local.icons',{ids:Q.splice(0,30)});
  if(Q.length)qt=setTimeout(flushQ,60);
}
function want(id){
  if(REQ[id])return;REQ[id]=1;Q.push(id);
  if(!qt)qt=setTimeout(flushQ,30);
  setTimeout(function(){
    if(ICONS[id]===undefined){ICONS[id]=0;giveUp(id)}
  },2500);
}
function giveUp(id){
  var w=WAIT[id];delete WAIT[id];
  if(w)w.forEach(function(x){web(x.i,id,x.raw)});
}

  ICONS[id]=src||0;
  var w=WAIT[id];delete WAIT[id];

  w.forEach(function(x){if(src){x.i.onerror=x.i.onload=null;x.i.src=src}else web(x.i,id,x.raw)});

  if(c===0||!live||!GAME_ICONS){web(i,id,raw);return i}
  (WAIT[id]=WAIT[id]||[]).push({i:i,raw:raw});

        r2.append(el('div','bd '+(x.t==='k'?'k':'d'),x.t==='k'?'К':'С'));

/* ================= ВАЙПБЛОК: одна страница с прокруткой ================= */
/* Названия и часы этапов берутся с сервера (поля sn/sh у предметов или d.names/d.hours), иначе - по умолчанию ниже */
var STG_N=['Свежесть','Спичка','Накал','Огонёк','Пушинка','Наступление'],STG_H=[2,4,6,10,24,28];
var pad2=function(n){return n<10?'0'+n:''+n};
var hms=function(s){s=Math.max(0,s);return pad2(Math.floor(s/3600))+':'+pad2(Math.floor(s%3600/60))+':'+pad2(s%60)};
var hrs=function(n){var a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'час':(a>=2&&a<=4&&(b<12||b>14))?'часа':'часов')};
var lastRef=0;
/* плавная прокрутка колесом (CEF отдаёт колесо рывками) */
function smooth(sc){
  var tgt=0,raf=0;
  function step(){
    var diff=tgt-sc.scrollTop;
    if(Math.abs(diff)<1){sc.scrollTop=tgt;raf=0;return}
    var st=diff*.2;if(Math.abs(st)<1)st=diff>0?1:-1;
    sc.scrollTop+=st;raf=requestAnimationFrame(step);
  }
  sc.addEventListener('wheel',function(e){
    e.preventDefault();
    var max=sc.scrollHeight-sc.clientHeight;
    tgt=Math.max(0,Math.min(max,(raf?tgt:sc.scrollTop)+e.deltaY*(e.deltaMode===1?32:1)));
    if(!raf)raf=requestAnimationFrame(step);
  },{passive:false});
}
function vBlock(box){
  var d=S.d['dip.block'];
  if(!d)return box.append(loading());
  var map={},keys=[];
  d.items.forEach(function(x){var k=x.s!=null?x.s:x.t;if(!map[k]){map[k]=[];keys.push(k)}map[k].push(x)});
  keys.sort(function(a,b){return a-b});
  var stages=keys.map(function(k,i){
    var it=map[k],f=it[0]||{},t=0;it.forEach(function(x){if(x.t>t)t=x.t});
    return{items:it,t:t,
      name:f.sn||(d.names&&d.names[i])||STG_N[i]||(i+1)+' этап',
      h:Number(f.sh||(d.hours&&d.hours[i])||STG_H[i]||0)};
  });
  var wrap=el('div','tlwrap'),tl=el('div','tl');
  tl.append(el('div','tlb'),el('div','tlf'));
  stages.forEach(function(st,i){
    var s=el('section','ts '+(i%2?'lf':'rt')),hd=el('div','th'),its=el('div','its');
    s.style.setProperty('--i',i);
    s.dataset.dl=d.at+st.t*1000;s.dataset.h=st.h;
    hd.append(el('b','',st.name),el('span','mt'));
    st.items.forEach(function(x,j){
      var t=el('div','it');t.dataset.n=title(x);t.style.setProperty('--j',Math.min(j,14));
      t.append(icon(x.id!=null?x.id:x.n));its.append(t);
    });
    s.append(el('i','dot'),hd,its);tl.append(s);
  });
  wrap.append(tl);
  var b=el('div','foot r'),rf=btn('Обновить','',function(){
    if(Date.now()-lastRef<5000)return;lastRef=Date.now();rf.disabled=true;setTimeout(function(){rf.disabled=false},5000);send('dip.block',{})});
  b.append(rf);
  if(stages.length){smooth(wrap);box.append(wrap,b)}else box.append(emptyMsg('Нет предметов'),b);
  tick();
}
/* раскладка как на фото: следующий этап встаёт сразу под предметами предыдущего (в другой колонке),
   но не залезает на этап своей же стороны */
function lay(rs,tl){
  var b1=-1e9,b2=-1e9,top,i;
  for(i=0;i<rs.length;i++){
    top=i?Math.max(b1-5,b2+22):0;
    rs[i].style.top=top+'px';
    b2=b1;b1=top+rs[i].offsetHeight;
  }
  tl.style.height=b1+'px';
}
/* таймеры этапов + синяя линия прогресса */
function tick(){
  var rs=document.querySelectorAll('#body .ts[data-dl]');
  if(!rs.length)return;
  var now=Date.now(),L=-1,left=[],y=[],i;
  lay(rs,rs[0].parentNode);
  for(i=0;i<rs.length;i++){
    var r=rs[i],l=Math.ceil((r.dataset.dl-now)/1000),h=+r.dataset.h,ul=l<=0;
    left.push(l);if(ul)L=i;
    r.classList.toggle('ul',ul);
    var mt=r.querySelector('.mt'),txt=(h?hrs(h):'')+(ul?'':(h?' · ':'')+hms(l));
    if(mt.textContent!==txt)mt.textContent=txt;
    y.push(r.offsetTop+11);                       /* центр точки этапа */
  }
  var tl=rs[0].parentNode,bl=tl.querySelector('.tlb'),fl=tl.querySelector('.tlf');
  var y0=y[0],tot=y[y.length-1]-y0,f=0;
  bl.style.top=fl.style.top=y0+'px';bl.style.height=Math.max(0,tl.offsetHeight-y0)+'px';fl.style.height=Math.max(0,tot)+'px';
  if(tot>0&&L>=0){
    if(L>=rs.length-1)f=1;
    else{                                         /* внутри текущего отрезка линия идёт по времени до следующего этапа */
      var span=(+rs[L+1].dataset.h-+rs[L].dataset.h)*3600,p=0;
      if(span>0)p=Math.max(0,Math.min(1,1-left[L+1]/span));
      f=((y[L]-y0)+p*(y[L+1]-y[L]))/tot;
    }
  }
  fl.style.transform='scaleY('+Math.max(0,Math.min(1,f))+')';
}
setInterval(tick,1000);addEventListener('resize',tick);

/* ================= НАСТРОЙКИ ================= */
var curPaint=null;
function vSet(box){
  var d=S.d['dip.settings'];
  if(!d)return box.append(loading());
  var w=el('div','set'),cs=el('div','cats'),tg=el('div','tg'),bs=[];
  function paint(anim){
    var cat=d.cats[S.cat]||d.cats[0];tg.textContent='';
    if(cat&&cat.b){drawBinds(tg,cat,anim);bs.forEach(function(b,i){b.classList.toggle('on',i===S.cat)});return}
    if(cat)cat.t.forEach(function(t,k){
      var r=el('div','sw'+(t.v?' on':'')+(anim?' vin':''));r.style.setProperty('--i',Math.min(k,14));
      r.append(el('span','',t.l),el('i'));
      r.onclick=function(){t.v=!t.v;r.classList.toggle('on',t.v);send('dip.set',{c:cat.k,i:t.id,v:t.v})};
      tg.append(r);
    });
    bs.forEach(function(b,i){b.classList.toggle('on',i===S.cat)});
  }
  d.cats.forEach(function(c,i){
    var b=btn(c.n,i===S.cat?'on':'',function(){if(S.cat===i)return;S.cat=i;paint(true)});
    bs.push(b);cs.append(b);
  });
  curPaint=paint;paint(false);w.append(cs,tg);box.append(w);
}

/* ================= БИНДЫ (категория с полем b: [{id,l,k}]) ================= */
/* Клавишу ловит КЛИЕНТ игры (страница букв/F-клавиш не получает): строка шлёт local.keycap,
   клиент отвечает сообщением {type:'keycap',i,k,c}. Esc - отмена, Backspace/Delete - снять бинд. */
function kname(k){return k?String(k).replace('Alpha','').replace('Keypad','Num ').replace('Arrow',''):'не назначено'}
var capCur=null;
function stopCap(){if(capCur){var c=capCur;capCur=null;c.done();send('local.keycap',{i:''})}}
function onKeycap(m){
  if(!capCur||capCur.b.id!==m.i)return;
  var c=capCur;capCur=null;
  if(!m.c){
    c.cat.b.forEach(function(o){if(m.k&&o.k===m.k&&o!==c.b)o.k=''});    /* дубль снимаем визуально, сервер подтвердит */
    c.b.k=m.k||'';
  }
  c.done();
  if(!m.c&&curPaint)curPaint(false);
}
function drawBinds(tg,cat,anim){
  stopCap();
  cat.b.forEach(function(b,k){
    var r=el('div','sw'+(anim?' vin':''));r.style.setProperty('--i',Math.min(k,14));
    var kb=el('b','kb'+(b.k?'':' empty'),kname(b.k));
    r.append(el('span','',b.l),kb);
    r.onclick=function(){
      if(capCur&&capCur.b===b)return;
      stopCap();
      kb.className='kb wait';kb.textContent='нажмите клавишу…';
      capCur={b:b,cat:cat,done:function(){kb.className='kb'+(b.k?'':' empty');kb.textContent=kname(b.k)}};
      send('local.keycap',{i:b.id});
    };
    tg.append(r);
  });
}

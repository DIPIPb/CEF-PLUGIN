<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--tx:#d6cdc3;--dim:rgba(255,255,255,.34);--pane:rgba(255,255,255,.055);--pane2:rgba(255,255,255,.09);--bl:#0000FF;--ok:#bbc47e;--bad:#e0947a}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:transparent;font:15px/1.3 "Roboto Condensed","Arial Narrow",Arial,sans-serif;color:var(--tx);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:var(--pane);cursor:pointer}
button:hover{background:var(--pane2)}
button.on,button.on:hover{background:var(--bl);color:#fff;font-weight:700}
button:disabled{opacity:.4;cursor:default}
img{display:block}
b{font-weight:700}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(40,40,40,.82),rgba(0,0,0,.92))}
#app.on{display:flex}
#x{position:fixed;top:12px;left:12px;width:44px;height:38px;font-size:20px;color:var(--bad);background:rgba(224,148,122,.2)}
#x:hover{background:rgba(224,148,122,.34)}
#shell{width:min(900px,96vw);height:min(540px,92vh);display:flex;gap:2%}
#side{width:27%;display:flex;flex-direction:column;gap:6px;min-height:0}
#me{display:flex;align-items:center;gap:12px;padding:8px 10px;background:var(--pane);height:68px;flex:none}
#ava{width:52px;height:52px;flex:none;background:var(--pane2);display:grid;place-items:center;font-size:22px;font-weight:700;overflow:hidden}
#ava img{width:100%;height:100%;object-fit:cover}
#me div{min-width:0}
#nm{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#exp{display:block;color:var(--dim);font-size:13px;margin-top:2px}
#nav{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#nav button{display:flex;align-items:center;gap:12px;flex:1 1 0;min-height:30px;max-height:52px;padding:0 12px;text-align:left;color:var(--dim);font-size:16px}
#nav button.on{color:#fff}
#nav .ic{width:24px;height:24px;flex:none;display:block}
#nav .ic svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.msg{margin:auto;color:var(--dim);font-size:16px;text-align:center;line-height:1.5}
.msg small{display:block;font-size:13px;margin-top:4px}
.row{display:flex;gap:8px;flex:none}
.row>button{height:44px;padding:0 20px;font-size:16px}
.row.seg>button{flex:1}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:none}
.tile{background:var(--pane);padding:9px 12px}
.tile small{color:var(--dim);font-size:13px}
.tile b{display:block;font-size:22px;margin-top:2px}
.grid{display:grid;gap:8px;flex:1;min-height:0;align-content:start}
.card{background:var(--pane2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 4px 6px;min-height:0;overflow:hidden}
.card img{width:56px;height:56px;object-fit:contain;flex:none}
.card span{font-size:12px;text-align:center;line-height:1.1;max-width:100%;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.card em{font-style:normal;font-weight:700;font-size:14px}
.card .bar2{display:none}
.card.lock img{opacity:.5}
.card.lock span{color:var(--dim)}
.card.free{background:rgba(187,196,126,.13)}
.card.free span{color:var(--ok)}
.card .pr{font-weight:700;font-size:13px}
.lst{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:0 12px;height:36px;background:rgba(255,255,255,.045);flex:none}
.li:nth-child(odd){background:rgba(255,255,255,.075)}
.li>*{flex:none}.li .w{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.li.h{background:rgba(255,255,255,.11);height:32px;color:var(--dim)}
.li.me{background:rgba(255,255,255,.17);font-weight:700}
.li img{width:26px;height:26px;object-fit:contain}
.c1{width:70px;text-align:right}
.rk{width:30px;text-align:center;color:var(--dim)}
.bd{width:20px;text-align:center;font-weight:700}
.bd.k{color:var(--ok)}.bd.d{color:var(--bad)}.bd.s{color:var(--dim)}
.dist{color:var(--dim);width:64px;text-align:right}
.pg{display:flex;gap:6px;flex:none;justify-content:center;align-items:center}
.pg button{min-width:44px;height:38px;padding:0 10px;font-size:16px}
.pg i{width:26px;text-align:center;color:var(--dim);font-style:normal}
.foot{display:flex;gap:10px;flex:none;align-items:center;justify-content:space-between}
.foot .pg{flex:1}
.foot>button{height:38px;padding:0 20px;flex:none;font-size:16px}
.stages{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.stg{display:flex;align-items:center;gap:14px;padding:7px 12px 7px 0;position:relative;flex:none}
.stg.ul{background:rgba(255,255,255,.075)}
.sl{width:96px;flex:none;text-align:center}
.sl b{display:block;font-size:17px;text-transform:uppercase}
.sl .tm{display:block;font-size:13px;margin-top:2px;font-weight:700;color:var(--dim)}
.ln{position:absolute;left:47px;width:2px;top:calc(50% + 26px);bottom:-9px;background:rgba(255,255,255,.16)}
.stg.nx .ln{background:#d9906c}
.stg:last-child .ln{display:none}
.its{display:grid;grid-template-columns:repeat(7,66px);gap:6px;flex:1;min-width:0}
.it{width:66px;height:66px;background:rgba(255,255,255,.075);display:grid;place-items:center}
.it img{width:58px;height:58px;object-fit:contain}
.warn{flex:none;background:rgba(209,178,131,.22);color:#d1b283;padding:10px;text-align:center}
.set{display:flex;gap:8px;flex:1;min-height:0}
.cats{width:34%;flex:none;display:flex;flex-direction:column;gap:6px}
.cats button{height:50px;text-align:left;padding:0 14px;color:var(--dim);font-size:16px}
.cats button.on{color:#fff}
.tg{flex:1;display:flex;flex-direction:column;gap:6px;overflow:hidden;min-height:0}
.sw{display:flex;justify-content:space-between;align-items:center;padding:0 14px;height:46px;background:var(--pane);cursor:pointer;flex:none}
.sw:hover{background:var(--pane2)}
.sw i{width:38px;height:20px;background:rgba(255,255,255,.12);position:relative;flex:none}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--dim);transition:left .12s}
.sw.on i{background:rgba(187,196,126,.3)}
.sw.on i:after{left:21px;background:var(--ok)}
.info{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.info p{background:var(--pane);padding:10px 14px;line-height:1.45;font-size:15px}
#demo{position:fixed;right:14px;bottom:14px;padding:10px 16px;display:none;background:var(--bl);color:#fff;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><button id="x" aria-label="Закрыть">✕</button>
<div id="shell"><div id="side"><div id="me"><div id="ava"></div><div><b id="nm"></b><small id="exp"></small></div></div><div id="nav"></div></div><div id="main"><div id="body"></div></div></div></div>
<button id="demo">Открыть меню (демо)</button>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var el=function(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
var btn=function(x,c,f){var b=el('button',c,x);b.onclick=f;return b};
var S={items:[],active:'',me:{},tab:'me',sub:'res',page:1,d:{},empty:{},cat:0,bf:'all'};
var live=false,demo=false;
var send=function(a,d){if(demo)return mock(a,d);if(window.cef&&cef.send)cef.send(a,d)};

/* ================= ИКОНКИ ================= */
/* Имена файлов rustlabs = shortname предмета (metal.ore.png, fat.animal.png, lowgradefuel.png ...) */
var ALIAS={
 'wood':'wood','дерево':'wood','древесина':'wood',
 'stones':'stones','stone':'stones','камень':'stones','камни':'stones',
 'metal ore':'metal.ore','металлическая руда':'metal.ore','метал руда':'metal.ore','руда':'metal.ore',
 'hq metal ore':'hq.metal.ore','high quality metal ore':'hq.metal.ore','мвк руда':'hq.metal.ore',
 'sulfur ore':'sulfur.ore','серная руда':'sulfur.ore',
 'sulfur':'sulfur','сера':'sulfur',
 'cloth':'cloth','ткань':'cloth',
 'leather':'leather','кожа':'leather',
 'animal fat':'fat.animal','fat animal':'fat.animal','жир':'fat.animal','животный жир':'fat.animal',
 'scrap':'scrap','металлолом':'scrap','скрап':'scrap',
 'metal fragments':'metal.fragments','metal fragment':'metal.fragments','металлические фрагменты':'metal.fragments','металлические обломки':'metal.fragments','фрагменты':'metal.fragments',
 'high quality metal':'metal.refined','metal refined':'metal.refined','hqm':'metal.refined','мвк':'metal.refined','металл высокого качества':'metal.refined',
 'low grade fuel':'lowgradefuel','lowgradefuel':'lowgradefuel','низкосортное топливо':'lowgradefuel','топливо':'lowgradefuel',
 'charcoal':'charcoal','уголь':'charcoal','древесный уголь':'charcoal',
 'gun powder':'gunpowder','gunpowder':'gunpowder','порох':'gunpowder',
 'bone fragments':'bone.fragments','bone fragment':'bone.fragments','кости':'bone.fragments','костные фрагменты':'bone.fragments',
 'plant fiber':'plantfiber','plantfiber':'plantfiber','растительное волокно':'plantfiber',
 'paper':'paper','бумага':'paper','explosives':'explosives','взрывчатка':'explosives','crude oil':'crude.oil','нефть':'crude.oil'
};
var RU={'wood':'Дерево','stones':'Камень','metal.ore':'Металл. руда','hq.metal.ore':'МВК руда','sulfur.ore':'Серн. руда','sulfur':'Сера','cloth':'Ткань','leather':'Кожа','fat.animal':'Жир','scrap':'Металлолом','metal.fragments':'Мет. фрагменты','metal.refined':'МВК','lowgradefuel':'Топливо','charcoal':'Уголь','gunpowder':'Порох','bone.fragments':'Кости','plantfiber':'Волокно','paper':'Бумага','explosives':'Взрывчатка','crude.oil':'Нефть'};
var norm=function(s){return String(s==null?'':s).toLowerCase().replace(/[._\-\s]+/g,' ').trim()};
function resolve(raw){
  var k=norm(raw);if(ALIAS[k])return ALIAS[k];
  var s=String(raw==null?'':raw).trim();
  return /^[A-Za-z0-9._ ]+$/.test(s)?s.toLowerCase():k.replace(/ /g,'.');
}
var SRC=function(id){
  var names=[id];
  if(/[ ]/.test(id))names.push(id.replace(/ +/g,'.'));          /* 'military flamethrower' -> 'military.flamethrower' */
  var out=[];
  names.forEach(function(n){var e=encodeURIComponent(n);
    out.push('icons/'+e+'.png',                                  /* своя копия (node download-icons.js) - быстрее всего */
             'https://rustlabs.com/img/items180/'+e+'.png',      /* оригинальные иконки предметов Rust */
             'https://www.rustedit.io/images/imagelibrary/'+e+'.png',
             'https://wiki.rustclash.com/img/items180/'+e+'.png')});
  return out};

/* встроенные SVG - показываются, если все сайты не ответили (нет интернета / блок хотлинка) */
var G='#9a9a96',GD='#6f6f6b';
var SVG={
 'wood':'<rect x="8" y="22" width="40" height="20" rx="10" fill="#7b4d28"/><rect x="14" y="26" width="30" height="3" fill="#9a6a3c"/><ellipse cx="46" cy="32" rx="8" ry="10" fill="#d2a468"/><ellipse cx="46" cy="32" rx="5" ry="6.5" fill="none" stroke="#a87b45" stroke-width="1.6"/><circle cx="46" cy="32" r="1.8" fill="#a87b45"/>',
 'stones':'<polygon points="8,46 18,26 32,30 36,46" fill="#8d8d89"/><polygon points="30,48 38,22 54,28 56,48" fill="#a6a6a1"/><polygon points="18,26 32,30 28,36 14,36" fill="#b9b9b4"/><polygon points="38,22 54,28 46,32" fill="#c4c4bf"/>',
 'metal.ore':'<polygon points="8,46 14,24 34,14 54,24 56,46 32,52" fill="#6d6a68"/><polygon points="14,24 34,14 40,30 22,34" fill="#85817f"/><circle cx="26" cy="40" r="3.5" fill="#c88a4a"/><circle cx="40" cy="36" r="3" fill="#d9a05a"/><circle cx="46" cy="44" r="2.6" fill="#c88a4a"/><circle cx="20" cy="30" r="2.2" fill="#d9a05a"/>',
 'hq.metal.ore':'<polygon points="8,46 14,24 34,14 54,24 56,46 32,52" fill="#5d6670"/><polygon points="14,24 34,14 40,30 22,34" fill="#78828d"/><circle cx="26" cy="40" r="3.5" fill="#9fc3e0"/><circle cx="40" cy="36" r="3" fill="#b8d6ee"/><circle cx="46" cy="44" r="2.6" fill="#9fc3e0"/>',
 'sulfur.ore':'<polygon points="8,46 14,24 34,14 54,24 56,46 32,52" fill="#7b7660"/><polygon points="14,24 34,14 40,30 22,34" fill="#948f76"/><polygon points="22,46 28,32 34,46" fill="#e4d24a"/><polygon points="36,46 42,30 48,46" fill="#f0e05a"/>',
 'sulfur':'<path d="M8 50 Q18 22 32 20 Q46 22 56 50 Z" fill="#d9c93f"/><path d="M18 50 Q26 30 32 28 Q40 30 46 50 Z" fill="#ece05a"/><circle cx="26" cy="42" r="2" fill="#bdae2c"/><circle cx="38" cy="38" r="2" fill="#bdae2c"/>',
 'cloth':'<rect x="10" y="16" width="44" height="32" rx="3" fill="#d8d1c2" transform="rotate(-8 32 32)"/><rect x="14" y="22" width="36" height="4" fill="#c2baa8" transform="rotate(-8 32 32)"/><rect x="14" y="32" width="36" height="4" fill="#c2baa8" transform="rotate(-8 32 32)"/>',
 'leather':'<path d="M12 18 L22 14 L32 18 L42 14 L52 18 L48 32 L52 46 L38 50 L32 46 L24 50 L12 46 L16 32 Z" fill="#8a5a38"/><path d="M22 24 L42 24 L40 40 L24 40 Z" fill="#a4714a"/>',
 'fat.animal':'<ellipse cx="32" cy="38" rx="20" ry="13" fill="#e9dfb2"/><ellipse cx="26" cy="32" rx="9" ry="6" fill="#f6eecb"/><ellipse cx="40" cy="42" rx="6" ry="3.5" fill="#d6c98f"/>',
 'scrap':'<circle cx="32" cy="32" r="17" fill="none" stroke="#a5a5a1" stroke-width="9" stroke-dasharray="6.6 6.6"/><circle cx="32" cy="32" r="15" fill="#8e8e8a"/><circle cx="32" cy="32" r="7" fill="#2a2928"/>',
 'metal.fragments':'<polygon points="8,40 20,26 30,38 22,48" fill="#8f979e"/><polygon points="30,30 42,16 54,28 44,40" fill="#a9b1b8"/><polygon points="24,50 38,40 54,48 44,56" fill="#777f86"/>',
 'metal.refined':'<polygon points="8,44 18,24 50,24 58,44" fill="#b4bcc4"/><polygon points="18,24 50,24 46,30 22,30" fill="#dde3e8"/><rect x="8" y="44" width="50" height="6" fill="#8a929a"/>',
 'lowgradefuel':'<rect x="16" y="22" width="32" height="34" rx="3" fill="#5f8a3c"/><rect x="24" y="14" width="16" height="9" fill="#3f5f27"/><rect x="21" y="30" width="22" height="14" fill="#cfe59a"/><rect x="26" y="33" width="12" height="3" fill="#5f8a3c"/>',
 'charcoal':'<polygon points="10,44 16,26 30,28 34,44" fill="#2c2c2c"/><polygon points="30,48 36,24 52,30 54,48" fill="#3a3a3a"/><polygon points="16,26 30,28 26,34 14,34" fill="#555"/>',
 'gunpowder':'<path d="M8 50 Q20 26 32 26 Q46 26 56 50 Z" fill="#3b3b3d"/><path d="M18 50 Q26 34 32 34 Q40 34 46 50 Z" fill="#505054"/>',
 'bone.fragments':'<polygon points="10,40 20,26 30,38 22,48" fill="#e5dfce"/><polygon points="30,30 42,18 54,30 44,42" fill="#f0ead9"/><polygon points="24,50 38,40 52,48 42,56" fill="#d2cbb6"/>',
 'plantfiber':'<path d="M14 52 Q18 30 28 14" stroke="#7aa648" stroke-width="5" fill="none"/><path d="M26 54 Q30 32 40 16" stroke="#98c25f" stroke-width="5" fill="none"/><path d="M38 54 Q40 36 50 22" stroke="#7aa648" stroke-width="5" fill="none"/>'
};
function fallback(id,raw){
  var inner=SVG[id];
  if(!inner&&/rifle|smg|pistol|shotgun|lmg|revolver|launcher|bow|gun|mp5|thompson|m249|hmlmg|minigun/.test(id))inner=GUN;
  if(!inner){
    var ch=(String(RU[id]||raw||'?').trim()[0]||'?').toUpperCase();
    inner='<rect x="8" y="8" width="48" height="48" rx="6" fill="#3a3733"/><text x="32" y="43" font-size="30" font-family="Arial" text-anchor="middle" fill="#d1b283">'+ch+'</text>';
  }
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">'+inner+'</svg>');
}
var BAD={};
var GUN='<path d="M4 28h34l4-6h10v10H42l-2 4H32l-3 12h-8l3-12H4z" fill="#8d8d89"/><rect x="42" y="24" width="12" height="3" fill="#b9b9b4"/>';
/* оригинальные иконки берём из самой игры (клиентский мод: local.icons -> {type:'icon',id,src}); сайты - только запасной путь */
var GAME_ICONS=false;   /* true = сначала просить иконки у клиентского мода (local.icons) */
var ICONS={},REQ={},WAIT={},Q=[],qt=0;
function web(i,id,raw){
  var L=SRC(id),k=0,tm=0;
  if(BAD[id]){i.src=fallback(id,raw);return}
  var arm=function(){tm=setTimeout(next,4000)};
  var next=function(){
    clearTimeout(tm);k++;
    if(k<L.length){arm();i.src=L[k]}
    else{i.onerror=i.onload=null;BAD[id]=1;i.src=fallback(id,raw)}
  };
  i.onload=function(){clearTimeout(tm)};
  i.onerror=next;
  arm();i.src=L[0];
}
function flushQ(){
  qt=0;
  if(Q.length)send('local.icons',{ids:Q.splice(0,30)});
  if(Q.length)qt=setTimeout(flushQ,60);
}
function want(id){
  if(REQ[id])return;REQ[id]=1;Q.push(id);
  if(!qt)qt=setTimeout(flushQ,30);
  setTimeout(function(){
    if(ICONS[id]===undefined){ICONS[id]=0;giveUp(id)}
  },2500);
}
function giveUp(id){
  var w=WAIT[id];delete WAIT[id];
  if(w)w.forEach(function(x){web(x.i,id,x.raw)});
}
function gotIcon(id,src){
  ICONS[id]=src||0;
  var w=WAIT[id];delete WAIT[id];
  if(!w)return;
  w.forEach(function(x){if(src){x.i.onerror=x.i.onload=null;x.i.src=src}else web(x.i,id,x.raw)});
}
function icon(raw,cls){
  var id=resolve(raw),i=el('img',cls);
  i.referrerPolicy='no-referrer';
  var c=ICONS[id];
  if(c){i.src=c;return i}
  if(c===0||!live||!GAME_ICONS){web(i,id,raw);return i}
  (WAIT[id]=WAIT[id]||[]).push({i:i,raw:raw});
  want(id);
  return i;
}
var title=function(x){var id=resolve(x.id!=null?x.id:x.n);return(x.n&&norm(x.n)!==norm(x.id))?x.n:(RU[id]||x.n||x.id||'')};

/* ================= СООБЩЕНИЯ ОТ СЕРВЕРА ================= */
function onMsg(m){
  if(!m||!m.type)return;
  if(m.type==='icon'){gotIcon(m.id,m.src);return}
  if(m.type==='dip.menu'){
    var sw=S.active!==m.active;S.items=m.items;S.me=m.me;S.active=m.active;
    if(sw){S.tab='me';S.sub='res';S.page=1;S.cat=0;S.bf='all'}
    $('#app').classList.add('on');$('#demo').style.display='none';
    if(!$('#app').dataset.cap){$('#app').dataset.cap=1;send('capture')}
    drawMe();drawNav();drawMain();
  }else if(m.type==='dip.empty'){S.empty[m.s]=true;drawMain()}
  else if(m.type.indexOf('dip.')===0){m.at=Date.now();S.d[m.type]=m;delete S.empty[m.type.slice(4)];drawMain()}
  else if(m.type==='capture'&&!m.on&&$('#app').classList.contains('on'))hide(false);
}
function hide(rel){
  $('#app').classList.remove('on');delete $('#app').dataset.cap;
  if(rel!==false)send('release');
  if(demo)$('#demo').style.display='block';
}
$('#x').onclick=function(){hide()};
addEventListener('keydown',function(e){if(e.key==='Escape'||e.keyCode===27)hide()});

/* ================= ЛЕВАЯ КОЛОНКА ================= */
function avaUrl(m){
  var v=m.ava||m.avatar||m.avatarfull||m.steamAvatar||m.steam_avatar||m.avatarUrl||'';
  v=String(v).trim();if(!v)return'';
  if(/^(https?:|data:)/i.test(v))return v;
  if(/^[0-9a-f]{40}$/i.test(v))return'https://avatars.steamstatic.com/'+v.toLowerCase()+'_full.jpg';
  return v;
}

function drawNav(){
  var n=$('#nav');n.textContent='';
  S.items.forEach(function(it){

/* ================= ОБЩЕЕ ================= */
function pages(cur,n){
  if(n<=7){var r=[];for(var i=1;i<=n;i++)r.push(i);return r}
  if(cur<=4)return[1,2,3,4,5,'..',n];
  if(cur>=n-3)return[1,'..',n-4,n-3,n-2,n-1,n];
  return[1,'..',cur-1,cur,cur+1,'..',n];
}
function pager(total,per){
  var n=Math.max(1,Math.ceil(total/per)),p=el('div','pg');
  if(S.page>n)S.page=n;
  if(n<2)return p;
  p.append(btn('‹','',function(){if(S.page>1){S.page--;drawMain()}}));
  pages(S.page,n).forEach(function(x){
    if(x==='..')p.append(el('i','','..'));
    else p.append(btn(x,x===S.page?'on':'',function(){S.page=x;drawMain()}));
  });
  p.append(btn('›','',function(){if(S.page<n){S.page++;drawMain()}}));
  return p;
}
var slice=function(a,per){return a.slice((S.page-1)*per,S.page*per)};
var num=function(v){return Number(v||0).toLocaleString('ru-RU')};
var short=function(v){v=Number(v||0);if(v>=1e6)return(v/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(v>=1e5)return Math.round(v/1e3)+'K';return num(v)};
function chips(){}

function drawMain(){
  var box=$('#body');box.textContent='';chips();
  var id=S.active,cur=null;
  S.items.forEach(function(it){if(it.id===id)cur=it});
  if(S.empty[id])return box.append(emptyMsg('Раздел пока недоступен','Загляните сюда позже'));
  if(id==='stat')vStat(box);
  else if(id==='block')vBlock(box);
  else if(id==='settings')vSet(box);
  else if(id==='store')vStore(box);
  else if(id==='info')vInfo(box);
  else box.append(el('div','msg','Загрузка…'));
}
function emptyMsg(a,b){var m=el('div','msg',a);if(b)m.append(el('small','',b));return m}
var loading=function(){return el('div','msg','Загрузка…')};

/* ================= СТАТИСТИКА ================= */
function vStat(box){
  var top=S.tab==='top',want=top?'top':S.sub,d=S.d['dip.stat'];
  var go=function(tab,sub){S.tab=tab;if(sub)S.sub=sub;S.page=1;drawMain();send('dip.stat',{tab:tab==='top'?'top':S.sub})};
  var r=el('div','row seg');
  r.append(btn('Моя статистика',top?'':'on',function(){go('me')}),btn('Топ игроков',top?'on':'',function(){go('top')}));
  box.append(r);
  if(!d||d.tab!==want)return box.append(loading());
  if(!top){
    var t=el('div','tiles');
    [['Убийств',d.me.k,'k'],['Смертей',d.me.d,'d'],['Соотношение',d.me.kd,'r'],['EXP добыто',d.me.exp,'']].forEach(function(a){
      var c=el('div','tile '+a[2]);c.append(el('small','',a[0]),el('b','',num(a[1])));t.append(c)});
    box.append(t);
    var s=el('div','row seg');
    [['res','Ресурсы'],['craft','Крафт'],['history','Убийства / Смерти']].forEach(function(p){
      s.append(btn(p[1],S.sub===p[0]?'on':'',function(){go('me',p[0])}))});
    box.append(s);
  }
  if(want==='res'||want==='craft'){
    var max=1;d.list.forEach(function(x){if(x.v>max)max=x.v});
    var g=el('div','grid');g.style.gridTemplateColumns='repeat(6,1fr)';g.style.gridAutoRows='116px';
    slice(d.list,12).forEach(function(x){
      var c=el('div','card'),bar=el('div','bar2');bar.style.width=Math.max(2,Math.round(x.v/max*100))+'%';
      c.append(icon(x.id!=null?x.id:x.n),el('span','',title(x)),el('em','',num(x.v)),bar);g.append(c)});
    box.append(d.list.length?g:emptyMsg('Пока пусто'),pager(d.list.length,12));
  }else if(want==='history'){
    var l=el('div','lst');
    slice(d.list,8).forEach(function(x){
      var r2=el('div','li'),w=el('div','w');
      if(x.t==='s'){r2.append(el('div','bd s','☠'));w.append('Вы совершили самоубийство');r2.append(w)}
      else{
        r2.append(el('div','bd '+(x.t==='k'?'k':'d'),x.t==='k'?'К':'С'));
        w.append(x.t==='k'?'Вы убили ':'Вас убил ',el('b','',x.w));
        r2.append(w);
        if(x.g){var gi=icon(x.g);gi.title=x.gn||x.g;r2.append(gi);r2.append(el('span','',x.gn||x.g))}
        r2.append(el('span','dist',Math.round(x.d)+' м'));
      }
      l.append(r2);
    });
    box.append(d.list.length?l:emptyMsg('Пока пусто'),pager(d.list.length,8));
  }else{
    var l2=el('div','lst'),h=el('div','li h');
    h.append(el('div','rk','#'),el('div','w','Игрок'));
    ['Убийств','Смертей','Добыто','K/D'].forEach(function(t){h.append(el('span','c1',t))});l2.append(h);
    slice(d.list,8).forEach(function(x,i){
      var pos=(S.page-1)*8+i+1,r3=el('div','li'+(x.n===S.me.name?' me':''));
      r3.append(el('div','rk'+(pos<4?' t'+pos:''),pos),el('div','w',x.n));
      [x.k,x.d,x.g,x.kd].forEach(function(v){r3.append(el('span','c1',num(v)))});l2.append(r3)});
    box.append(l2,pager(d.list.length,8));
  }
}

/* ================= ВАЙПБЛОК ================= */
var pad2=function(n){return n<10?'0'+n:''+n};
var hms=function(s){s=Math.max(0,s);return pad2(Math.floor(s/3600))+':'+pad2(Math.floor(s%3600/60))+':'+pad2(s%60)};
var lastRef=0;
function vBlock(box){
  var d=S.d['dip.block'];
  if(!d)return box.append(loading());
  var map={},keys=[];
  d.items.forEach(function(x){var k=x.s!=null?x.s:x.t;if(!map[k]){map[k]=[];keys.push(k)}map[k].push(x)});
  keys.sort(function(a,b){return a-b});
  var PR=7,MAXH=490,stages=keys.map(function(k,i){
    var it=map[k],t=0;it.forEach(function(x){if(x.t>t)t=x.t});return{n:i+1,items:it,t:t}});
  var pages=[],cur=[],h=0;
  stages.forEach(function(st){
    var r=Math.ceil(st.items.length/PR),sh=r*66+(r-1)*6+14;
    if(cur.length&&h+sh+8>MAXH){pages.push(cur);cur=[];h=0}
    cur.push(st);h+=sh+8;
  });
  if(cur.length)pages.push(cur);
  if(S.page>pages.length)S.page=pages.length||1;
  var wrap=el('div','stages');
  (pages[S.page-1]||[]).forEach(function(st){
    var row=el('div','stg'),lab=el('div','sl'),tm=el('span','tm'),its=el('div','its');
    row.dataset.dl=d.at+st.t*1000;
    lab.append(el('b','',st.n+' этап'),tm);
    st.items.forEach(function(x){
      var t=el('div','it');t.title=title(x);t.append(icon(x.id!=null?x.id:x.n));its.append(t)});
    row.append(lab,el('div','ln'),its);wrap.append(row);
  });
  var b=el('div','foot'),rf=btn('Обновить','',function(){
    if(Date.now()-lastRef<5000)return;lastRef=Date.now();rf.disabled=true;setTimeout(function(){rf.disabled=false},5000);send('dip.block',{})});
  b.append(pager(pages.length,1),rf);
  box.append(pages.length?wrap:emptyMsg('Нет предметов'),b);tick();
}
function tick(){
  var rs=document.querySelectorAll('#body .stg[data-dl]');
  for(var i=0;i<rs.length;i++){
    var r=rs[i],left=Math.ceil((r.dataset.dl-Date.now())/1000);
    r.querySelector('.tm').textContent=hms(left);
    r.classList.toggle('ul',left<=0);
  }
  for(var j=0;j<rs.length;j++)rs[j].classList.toggle('nx',!!rs[j+1]&&!rs[j+1].classList.contains('ul'));
}
setInterval(tick,1000);

/* ================= НАСТРОЙКИ ================= */
function vSet(box){
  var d=S.d['dip.settings'];

  var w=el('div','set'),cs=el('div','cats'),tg=el('div','tg');
  d.cats.forEach(function(c,i){cs.append(btn(c.n,i===S.cat?'on':'',function(){S.cat=i;drawMain()}))});

  if(cat)cat.t.forEach(function(t){

    tg.append(r);
  });
  w.append(cs,tg);box.append(w);
}

/* ================= КОРЗИНА (если сервер пришлёт dip.store: {items:[{id,n,c,p}]}) ================= */
function vStore(box){
  var d=S.d['dip.store'];

  var g=el('div','grid');g.style.gridTemplateColumns='repeat(6,1fr)';g.style.gridAutoRows='116px';

    var c=el('div','card');c.append(icon(x.id!=null?x.id:x.n),el('span','',title(x)),el('em','',x.c!=null?'×'+num(x.c):''));
    if(x.p!=null)c.append(el('div','pr',num(x.p)));g.append(c)});
  box.append(g,pager(items.length,12));
}

/* ================= ИНФОРМАЦИЯ (dip.info: {lines:[...]} или {text:"..."}) ================= */
function vInfo(box){
  var d=S.d['dip.info'];
  if(!d)return box.append(loading());
  var lines=d.lines||(d.text?String(d.text).split('\n'):[]);
